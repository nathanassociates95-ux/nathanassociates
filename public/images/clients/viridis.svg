<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 90" width="220" height="90">
  <!-- Background -->
  <rect width="220" height="90" rx="10" fill="#ffffff"/>
  <!-- Sun rays / solar energy icon -->
  <circle cx="38" cy="45" r="11" fill="#f59e0b"/>
  <!-- Solar rays -->
  <line x1="38" y1="20" x2="38" y2="27" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="63" x2="38" y2="70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="13" y1="45" x2="20" y2="45" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="45" x2="63" y2="45" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="27" x2="25" y2="32" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="51" y1="58" x2="56" y2="63" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="27" x2="51" y2="32" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="25" y1="58" x2="20" y2="63" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Leaf overlay for green energy -->
  <ellipse cx="38" cy="45" rx="7" ry="10" fill="#1a6b3c" opacity="0.85" transform="rotate(30 38 45)"/>
  <ellipse cx="38" cy="45" rx="3" ry="8" fill="#ffffff" opacity="0.5" transform="rotate(30 38 45)"/>
  <!-- Viridis text -->
  <text x="78" y="36" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="19" fill="#1a6b3c">Viridis</text>
  <text x="78" y="56" font-family="Arial, sans-serif" font-weight="600" font-size="13" fill="#f59e0b" letter-spacing="1">ENERGY</text>
  <text x="78" y="72" font-family="Arial, sans-serif" font-size="8.5" fill="#888888">Renewable Power Solutions</text>
</svg>