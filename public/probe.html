<!doctype html>
<html>
  <head><meta charset="utf-8" /></head>
  <body style="font-family: monospace; background: #fff; margin: 0">
    <pre id="out">loading...</pre>
    <iframe id="f" src="/services/approvals" style="width: 390px; height: 400px; border: 0"></iframe>
    <script>
      function fmt(label, d, w) {
        return (
          label +
          " innerWidth=" + w.innerWidth +
          " clientWidth=" + d.documentElement.clientWidth +
          " docScrollWidth=" + d.documentElement.scrollWidth +
          " dpr=" + window.devicePixelRatio +
          " outerWidth=" + window.outerWidth
        );
      }
      var lines = [];
      lines.push("TOP " + fmt("top", document, window));
      var frame = document.getElementById("f");
      frame.addEventListener("load", function () {
        setTimeout(function () {
          lines.push(
            "IFRAME " + fmt("frame", frame.contentDocument, frame.contentWindow)
          );
          var d = frame.contentDocument,
            vw = frame.contentWindow.innerWidth,
            els = d.querySelectorAll("*"),
            n = 0;
          for (var i = 0; i < els.length && n < 25; i++) {
            var r = els[i].getBoundingClientRect();
            var cn =
              typeof els[i].className === "string"
                ? els[i].className.slice(0, 60)
                : "";
            var clipped = false;
            for (var p = els[i].parentElement; p; p = p.parentElement) {
              var ov = frame.contentWindow.getComputedStyle(p).overflowX;
              if (ov === "hidden" || ov === "clip" || ov === "auto" || ov === "scroll") {
                clipped = true;
                break;
              }
            }
            if ((r.right > vw + 1 || r.left < -1) && !clipped) {
              lines.push(
                els[i].tagName + " [" + cn + "] L" + Math.round(r.left) + " R" + Math.round(r.right)
              );
              n++;
            }
          }
          lines.push("unclipped_overflowing=" + n);
          document.getElementById("out").textContent = lines.join("\n");
        }, 2500);
      });
      document.getElementById("out").textContent = lines.join("\n") + "\n(top measured, waiting for frame)";
    </script>
  </body>
</html>
